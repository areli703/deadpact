<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEADPACT district</title>
<style>html,body{margin:0;background:#05070c;overflow:hidden}#c{display:block}</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const W = 1600, H = 900;

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias: true,
  preserveDrawingBuffer: true,
});
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.40;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const FOG = new THREE.Color(0x0a0e18);
scene.background = FOG.clone();
scene.fog = new THREE.FogExp2(0x161d30, 0.0058);

// ---------------------------------------------------------------- camera
const camera = new THREE.PerspectiveCamera(56, W / H, 0.1, 900);
camera.position.set(0.2, 1.35, 6.2);
camera.lookAt(-0.1, 1.35, -6);

// ------------------------------------------------------------- materials
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

const concreteMats = [0x2b2f38, 0x33373f, 0x24272e, 0x3a3d44].map(
  (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.88, metalness: 0.04 })
);

// wet asphalt
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0d1017, roughness: 0.22, metalness: 0.68,
});

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// far horizon glow — gives the horde a LIT backdrop to silhouette against.
// Dark figures on a dark background never read; against a warm horizon they do.
(function horizonGlow() {
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 256;
  const cx = cv.getContext('2d');
  // NOTE: PlaneGeometry UVs have v=0 at the BOTTOM of the plane, so the
  // gradient must start (offset 0) with the sky and end with the horizon glow.
  const g = cx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#05070c');
  g.addColorStop(0.40, '#0e1424');
  g.addColorStop(0.62, '#2a2438');
  g.addColorStop(0.78, '#7d4426');
  g.addColorStop(0.90, '#e07a34');
  g.addColorStop(1.00, '#ffb264');
  cx.fillStyle = g;
  cx.fillRect(0, 0, 8, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(900, 220),
    new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, depthWrite: false, fog: false })
  );
  // bottom edge sits just below the ground horizon so the warm band is VISIBLE
  // instead of being hidden under the asphalt plane.
  sky.position.set(0, 110, -210);
  sky.renderOrder = -10;
  scene.add(sky);
})();

// --------------------------------------------------------------- lighting
scene.add(new THREE.HemisphereLight(0x5b7099, 0x1a1d24, 1.5));

const moon = new THREE.DirectionalLight(0xb6c8ec, 1.5);
moon.position.set(-42, 58, 22);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -60;
moon.shadow.camera.right = 60;
moon.shadow.camera.top = 60;
moon.shadow.camera.bottom = -60;
moon.shadow.camera.far = 220;
moon.shadow.bias = -0.0008;
scene.add(moon);

// --------------------------------------------------------- city geometry
const BUILD_NEAR = 18, BUILD_FAR = -160, ROAD_HALF = 5.0, WALK = 2.6;

const windowGeo = new THREE.PlaneGeometry(1, 1);
const windowMat = new THREE.MeshBasicMaterial({ toneMapped: false });
const windows = [];   // {matrix, color}
const lampSpots = [];
const buildings = [];

const m4 = new THREE.Matrix4();
const q = new THREE.Quaternion();
const sc = new THREE.Vector3();
const pos = new THREE.Vector3();

function pushWindow(x, y, z, w, h, facing, color) {
  sc.set(w, h, 1);
  pos.set(x, y, z);
  q.setFromEuler(new THREE.Euler(0, facing, 0));
  m4.compose(pos, q, sc);
  windows.push({ m: m4.clone(), c: new THREE.Color(color) });
}

let z = BUILD_NEAR;
while (z > BUILD_FAR) {
  const gap = pick([0, 0, 3.5, 7]);
  for (const side of [-1, 1]) {
    let depth = rnd(10, 18);
    if (Math.random() < 0.22) depth *= 1.7;
    let height = pick([15, 20, 26, 31, 38, 45, 54, 66]);
    if (Math.random() < 0.18) height = rnd(66, 96);

    const xEdge = side * (ROAD_HALF + WALK);
    const bx = side > 0 ? xEdge : xEdge - depth;
    const cx = bx + depth / 2;

    const bmat = pick(concreteMats);
    const body = new THREE.Mesh(new THREE.BoxGeometry(depth, height, 11), bmat);
    body.position.set(cx, height / 2, z - 5.5);
    body.castShadow = true;
    body.receiveShadow = true;
    scene.add(body);

    const parapet = new THREE.Mesh(
      new THREE.BoxGeometry(depth + 0.7, 1.1, 11.7),
      concreteMats[2]
    );
    parapet.position.set(cx, height + 0.55, z - 5.5);
    parapet.castShadow = true;
    scene.add(parapet);

    if (height > 52) {
      const ant = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, rnd(6, 14), 0.5),
        new THREE.MeshStandardMaterial({ color: 0x23262c, roughness: 1 })
      );
      ant.position.set(cx, height + rnd(4, 8), z - 5.5);
      scene.add(ant);
      // blinking aviation light
      const bl = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff2a1a, toneMapped: false })
      );
      bl.position.set(cx, height + 14, z - 5.5);
      scene.add(bl);
    }

    // ---- street-facing lit windows
    const faceX = side > 0 ? bx + 0.06 : bx + depth - 0.06;
    const facing = side > 0 ? -Math.PI / 2 : Math.PI / 2;
    const cols = Math.max(2, Math.floor(depth / 3.3));
    const rows = Math.max(2, Math.floor((height - 4) / 3.1));
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const roll = Math.random();
        let col;
        if (roll < 0.26) col = pick([0xffb248, 0xffcf7a, 0xff9a3c]);
        else if (roll < 0.36) col = pick([0x7fc4ff, 0x9fd8ff, 0x5aa9e6]);
        else if (roll < 0.50) col = 0x2e2a26;
        else continue;
        const wy = 2.6 + r * 3.1;
        if (wy > height - 2) continue;
        const wz = z - 10.4 + (c + 0.5) * (depth / cols);
        pushWindow(faceX, wy, wz, 1.15, 1.5, facing, col);
      }
    }

    buildings.push({ cx, bx, depth, z, height, side });
    if (Math.random() < 0.8) lampSpots.push([side * (ROAD_HALF + 0.9), z - 5.5]);
  }
  z -= 11 + gap;
}

// window instanced mesh
const winMesh = new THREE.InstancedMesh(windowGeo, windowMat, windows.length);
windows.forEach((w, i) => {
  winMesh.setMatrixAt(i, w.m);
  winMesh.setColorAt(i, w.c);
});
winMesh.instanceMatrix.needsUpdate = true;
scene.add(winMesh);

// ------------------------------------------------------- distant skyline
for (let i = 0; i < 34; i++) {
  const h = rnd(20, 56);
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(rnd(12, 30), h, rnd(12, 30)),
    new THREE.MeshStandardMaterial({ color: 0x141822, roughness: 1 })
  );
  b.position.set(rnd(-220, 220), h / 2, rnd(-380, -240));
  scene.add(b);
}

// ------------------------------------------------------------- streetlights
const lampWarm = new THREE.Color(0xffb45e);
const lampGeo = new THREE.SphereGeometry(0.30, 12, 12);
const lampMat = new THREE.MeshBasicMaterial({ color: 0xffc879, toneMapped: false });
const poleMat = new THREE.MeshStandardMaterial({ color: 0x1a1d23, roughness: 0.75, metalness: 0.5 });
const coneMat = new THREE.MeshBasicMaterial({
  color: 0xffb45e, transparent: true, opacity: 0.05,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
});

lampSpots.slice(0, 9).forEach(([lx, lz]) => {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.15, 6.4, 8), poleMat);
  pole.position.set(lx, 3.2, lz);
  pole.castShadow = true;
  scene.add(pole);

  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.14, 0.14), poleMat);
  arm.position.set(lx - Math.sign(lx) * 0.75, 6.35, lz);
  scene.add(arm);

  const hx = lx - Math.sign(lx) * 1.45;
  const head = new THREE.Mesh(lampGeo, lampMat);
  head.position.set(hx, 6.2, lz);
  scene.add(head);

  const light = new THREE.PointLight(0xffb45e, 26, 26, 2.0);
  light.position.set(hx, 6.0, lz);
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  light.shadow.bias = -0.004;
  scene.add(light);

  const cone = new THREE.Mesh(new THREE.ConeGeometry(4.2, 6.0, 20, 1, true), coneMat);
  cone.position.set(hx, 3.2, lz);
  scene.add(cone);
});

// --------------------------------------------------- city glow at horizon
function glowTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(256, 256, 20, 256, 256, 250);
  grd.addColorStop(0, 'rgba(255,150,60,0.85)');
  grd.addColorStop(0.45, 'rgba(220,110,50,0.30)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 512, 512);
  return new THREE.CanvasTexture(cv);
}
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(460, 230),
  new THREE.MeshBasicMaterial({
    map: glowTexture(), transparent: true, opacity: 0.42,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  })
);
glow.position.set(-8, 20, -186);
scene.add(glow);

// ------------------------------------------------------------ abandoned car
function buildCar(x, z, rotY) {
  const g = new THREE.Group();
  const shell = new THREE.MeshStandardMaterial({
    color: 0x14171d, roughness: 0.45, metalness: 0.55,
  });
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.75, 4.3), shell);
  b1.position.y = 0.62; b1.castShadow = true; g.add(b1);
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.62, 2.2), shell);
  b2.position.set(0, 1.28, -0.15); b2.castShadow = true; g.add(b2);
  const glass = new THREE.MeshStandardMaterial({
    color: 0x0a0f16, roughness: 0.1, metalness: 0.9,
  });
  const w = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.45, 2.15), glass);
  w.position.set(0, 1.3, -0.15); g.add(w);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0b0d10, roughness: 1 });
  for (const [wx, wz] of [[-1.02, 1.35], [1.02, 1.35], [-1.02, -1.35], [1.02, -1.35]]) {
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.26, 10), wheelMat);
    wh.rotation.z = Math.PI / 2;
    wh.position.set(wx, 0.42, wz);
    g.add(wh);
  }
  const tail = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 0.16, 0.08),
    new THREE.MeshBasicMaterial({ color: 0x6e1208, toneMapped: false })
  );
  tail.position.set(0, 0.82, 2.16);
  g.add(tail);
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);
}
buildCar(-2.6, -9, 0.16);
buildCar(3.1, -40, -0.12);

// ------------------------------------------------------------- characters
const skin = new THREE.MeshStandardMaterial({ color: 0x3c424c, roughness: 0.72, metalness: 0.12 });
const pack = new THREE.MeshStandardMaterial({ color: 0x2a2f38, roughness: 0.95 });

function figure(scale) {
  const g = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.78, 0.36), skin);
  torso.position.y = 1.20; torso.castShadow = true; g.add(torso);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.36, 0.34), skin);
  head.position.y = 1.80; head.castShadow = true; g.add(head);
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.72, 0.21), skin);
    arm.position.set(s * 0.41, 1.18, 0); arm.castShadow = true; g.add(arm);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.23, 0.80, 0.25), skin);
    leg.position.set(s * 0.17, 0.40, 0); leg.castShadow = true; g.add(leg);
  }
  g.scale.setScalar(scale);
  return g;
}

// A zombie reads by POSTURE, not colour: forward hunch, lowered head,
// both arms reaching out ahead. That silhouette is unmistakable even at
// distance and in fog, which plain standing figures never are.
function zombieFigure(scale) {
  const g = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.60, 0.76, 0.34), skin);
  torso.position.set(0.10, 1.10, 0); torso.rotation.x = 0.62; torso.castShadow = true; g.add(torso);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.34, 0.32), skin);
  head.position.set(0.30, 1.66, 0.06); head.rotation.x = 0.70; head.castShadow = true; g.add(head);
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.66, 0.19), skin);
    arm.position.set(0.46, 1.30, s * 0.22); arm.rotation.x = -1.62; arm.castShadow = true; g.add(arm);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.78, 0.24), skin);
    leg.position.set(s * 0.05, 0.39, 0); leg.castShadow = true; g.add(leg);
  }
  g.scale.setScalar(scale);
  return g;
}

// Guarantees a figure reads against a dark background: every mesh gets an
// enlarged back-face shell drawn additively, producing a glowing rim outline.
function rimShell(root, color, thickness = 1.075, opacity = 0.85) {
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, side: THREE.BackSide,
    depthWrite: false, toneMapped: false,
  });
  const add = [];
  root.traverse((n) => {
    if (!n.isMesh || n.userData.shell) return;
    const s = n.clone();
    s.material = mat;
    s.scale.multiplyScalar(thickness);
    s.userData.shell = true;
    s.castShadow = false;
    s.receiveShadow = false;
    s.renderOrder = -1;
    add.push([n, s]);
  });
  add.forEach(([parent, s]) => parent.add(s));
}

// the survivor — foreground, back to us, pack + rifle
const hero = figure(1.0);
hero.position.set(-1.15, 0, 0.9);
hero.rotation.y = Math.PI + 0.06;
const bp = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.66, 0.26), pack);
bp.position.set(0, 1.22, -0.30);
hero.add(bp);
const rifle = new THREE.Mesh(
  new THREE.BoxGeometry(0.10, 0.12, 1.15),
  new THREE.MeshStandardMaterial({ color: 0x0c0e12, roughness: 0.5, metalness: 0.6 })
);
rifle.position.set(0.34, 1.30, 0.30);
hero.add(rifle);
rimShell(hero, 0x8fb6ff, 1.055, 0.42);
scene.add(hero);

// rim light behind the hero so the silhouette separates from the ground
const rim = new THREE.PointLight(0xa8c4f0, 22, 11, 2.2);
rim.position.set(0.9, 3.4, 3.6);
scene.add(rim);

// the horde — hunched, reaching, clustered in rows so it reads as a mass
const horde = [];
function dressZombie(f) {
  f.children.forEach((c) => {
    if (c.userData.shell) return;
    c.material = new THREE.MeshStandardMaterial({
      color: pick([0x4a5340, 0x3e4a35, 0x556047]), roughness: 0.95,
    });
  });
}
for (let i = 0; i < 30; i++) {
  const f = zombieFigure(rnd(1.45, 1.95));
  const row = i % 4;
  f.position.set(rnd(-6.0, 7.0), 0, -3.6 - row * 3.2 - rnd(0, 1.6));
  // profile-biased: a hunch only reads in silhouette when seen side-on
  f.rotation.y = pick([1.45, -1.45, 1.15, -1.15, 1.75, -1.75]) + rnd(-0.25, 0.25);
  dressZombie(f);
  scene.add(f);
  horde.push(f);
}
// close threats — side-on so the reaching, hunched posture reads clearly
for (const [x, z, ry, sc] of [[1.9, 0.4, -1.5, 2.3], [-0.1, -2.4, 1.5, 1.9], [3.4, -4.0, 1.4, 1.7]]) {
  const f = zombieFigure(sc);
  f.position.set(x, 0, z);
  f.rotation.y = ry;
  dressZombie(f);
  scene.add(f);
  horde.push(f);
}

// backlight the horde so their silhouettes read against the horizon glow
const hordeBack = new THREE.PointLight(0xffb060, 42, 52, 1.7);
hordeBack.position.set(-1.0, 4.2, -41);
scene.add(hordeBack);
const hordeBack2 = new THREE.PointLight(0xffa04c, 20, 26, 1.7);
hordeBack2.position.set(3.6, 3.4, -19);
scene.add(hordeBack2);

// --------------------------------------------------------------- rainfall
const RAIN = 2600;
const rp = new Float32Array(RAIN * 6);
for (let i = 0; i < RAIN; i++) {
  const x = rnd(-34, 34), y = rnd(0, 26), zz = rnd(-70, 26);
  const len = rnd(0.55, 1.25);
  rp[i * 6 + 0] = x;
  rp[i * 6 + 1] = y;
  rp[i * 6 + 2] = zz;
  rp[i * 6 + 3] = x + 0.10;
  rp[i * 6 + 4] = y - len;
  rp[i * 6 + 5] = zz;
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rp, 3));
const rain = new THREE.LineSegments(
  rainGeo,
  new THREE.LineBasicMaterial({
    color: 0xaec6e8, transparent: true, opacity: 0.16,
    blending: THREE.AdditiveBlending, depthWrite: false,
  })
);
scene.add(rain);

// ------------------------------------------------------------ post effects
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.22, 0.9, 0.95);
composer.addPass(bloom);

const GradePass = {
  uniforms: {
    tDiffuse: { value: null },
    vig: { value: 1.0 },
  },
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);} `,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float vig; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 d = vUv - 0.5;
      float v = smoothstep(1.15, 0.28, length(d) * 1.42);
      c.rgb *= mix(1.0, v, 0.78 * vig);
      // subtle cool lift in shadows, warm in highlights
      float l = dot(c.rgb, vec3(0.299,0.587,0.114));
      c.rgb += vec3(-0.012, 0.0, 0.028) * (1.0 - l);
      c.rgb += vec3(0.030, 0.014, -0.010) * l;
      gl_FragColor = c;
    }`,
};
composer.addPass(new ShaderPass(GradePass));

// ------------------------------------------------------------------ render
let frames = 0;
function loop() {
  if (frames < 4) {
    composer.render();
    frames++;
    requestAnimationFrame(loop);
  } else {
    document.title = 'RENDER_DONE';
  }
}
loop();
window.__deadpact_ready = true;
</script>
</body>
</html>
